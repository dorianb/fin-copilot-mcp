[project]
name = "screener"
version = "0.1.0"
description = "Serveur MCP yfinance pour identifier des valeurs boursières prometteuses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.44.0",
    "yfinance>=0.2.54",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
screener = "screener.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
